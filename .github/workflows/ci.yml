name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.14 is not optional padding: it is the interpreter this project is
        # actually developed and tested on. Without it, "the tests pass" locally and
        # "the tests pass" in CI were claims about two different interpreters. Nothing
        # here (or in README.md, doctor's venv hint, or the session-start hook) tells
        # anyone to install a particular minor version — the project supports >= 3.11,
        # and this matrix is what makes that claim true rather than a pinned prose
        # number that goes stale.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev -c constraints.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not network and not llm and not device" -v

  # The matrix above installs against constraints.txt, so it tests a known set. This
  # job deliberately does NOT, so an upstream release that breaks the project (or
  # changes the Deno sandbox flags constraints.txt exists to protect) still shows up
  # instead of being hidden by the pin. It is allowed to fail: a red canary is a
  # signal to look, not a reason to block a merge.
  latest-deps:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . --group dev
      # Show what drifted from the pinned set. Comments and blank lines are
      # stripped first, or the diff would always report the header block.
      - run: |
          pip freeze --exclude-editable | sort > /tmp/now.txt
          grep -vE '^#|^$' constraints.txt > /tmp/pinned.txt
          diff -u /tmp/pinned.txt /tmp/now.txt || true
      - run: pytest -m "not network and not llm and not device" -q
