[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "media-tools"
version = "0.1.0"
description = "Command-line tools to compress, convert, split, download and organise media and ebooks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "imageio-ffmpeg>=0.6",
    "yt-dlp[default,deno]>=2026.8.19",
]

[project.scripts]
media-tools = "media_tools.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/media_tools"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs the public internet",
    "llm: calls a real LLM API",
    "device: needs a real Kindle connected",
]
